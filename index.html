<title>Répète entre les séries</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f1;
    --surface:#ffffff;
    --surface-2:#ececE6;
    --text:#111312;
    --text-dim:#5d625f;
    --accent:#7a8f00;
    --accent-ink:#ffffff;
    --danger:#c14a2c;
    --good:#2f8f5b;
    --border:#dcdfd6;
    color-scheme:light;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0d0a;
      --surface:#15180f;
      --surface-2:#1c2013;
      --text:#f4f6ee;
      --text-dim:#9aa090;
      --accent:#d4ff3f;
      --accent-ink:#10130a;
      --danger:#ff6b47;
      --good:#3ddc84;
      --border:#2a2f1f;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0d0a;
    --surface:#15180f;
    --surface-2:#1c2013;
    --text:#f4f6ee;
    --text-dim:#9aa090;
    --accent:#d4ff3f;
    --accent-ink:#10130a;
    --danger:#ff6b47;
    --good:#3ddc84;
    --border:#2a2f1f;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Work Sans", system-ui, sans-serif;
    padding-inline:16px;
    padding-block:20px 32px;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  .brand h1{
    font-family:"Bebas Neue", "Work Sans", sans-serif;
    font-size:clamp(28px,7vw,36px);
    letter-spacing:0.5px;
    margin:0;
    line-height:0.95;
  }
  .brand h1 span{color:var(--accent);}
  .brand small{color:var(--text-dim); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
  }

  /* ---- SETUP SCREEN ---- */
  .subjects{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
  }
  .chip{
    appearance:none;
    border:1.5px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    border-radius:12px;
    padding:12px 10px;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    line-height:1.15;
  }
  .chip .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--border);
    flex:none;
    transition:background .15s;
  }
  .chip[aria-pressed="true"]{
    border-color:var(--accent);
    box-shadow:inset 0 0 0 1px var(--accent);
  }
  .chip[aria-pressed="true"] .dot{background:var(--accent);}

  .durations{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .dur-btn{
    flex:1;
    appearance:none;
    border:1.5px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    border-radius:12px;
    padding:10px 0;
    font-family:"Bebas Neue", sans-serif;
    font-size:18px;
    letter-spacing:0.03em;
    cursor:pointer;
  }
  .dur-btn[aria-pressed="true"]{
    background:var(--accent);
    color:var(--accent-ink);
    border-color:var(--accent);
  }

  .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    font-weight:700;
    color:var(--text-dim);
  }

  .start-btn{
    appearance:none;
    border:none;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:"Bebas Neue", sans-serif;
    font-size:24px;
    letter-spacing:0.04em;
    border-radius:16px;
    padding:16px;
    width:100%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .start-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .start-btn svg{width:20px;height:20px;}

  .stats-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .stat{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 10px;
    text-align:center;
  }
  .stat b{
    display:block;
    font-family:"Bebas Neue", sans-serif;
    font-size:26px;
    line-height:1;
    color:var(--accent);
  }
  .stat span{
    display:block;
    margin-top:4px;
    font-size:10.5px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-weight:700;
  }

  /* ---- RUNNING SCREEN ---- */
  .run-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .timer-wrap{
    position:relative;
    width:96px;
    height:96px;
    flex:none;
  }
  .timer-wrap svg{transform:rotate(-90deg); width:100%; height:100%;}
  .timer-wrap circle{fill:none; stroke-width:8;}
  .ring-bg{stroke:var(--border);}
  .ring-fg{stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset 1s linear;}
  .timer-num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:"Bebas Neue", sans-serif;
    font-size:22px;
  }
  .run-meta{flex:1; padding-left:16px;}
  .run-meta .label{margin-bottom:4px;}
  .run-meta .progress{
    font-family:"Bebas Neue", sans-serif;
    font-size:20px;
  }
  .stop-btn{
    appearance:none;
    border:1.5px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    border-radius:10px;
    padding:8px 12px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
  }

  .qcard{
    margin-top:14px;
  }
  .qcard .tag{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--accent);
    background:var(--surface-2);
    border-radius:100px;
    padding:4px 10px;
    margin-bottom:10px;
  }
  .qcard h2{
    font-family:"Work Sans", sans-serif;
    font-weight:700;
    font-size:19px;
    line-height:1.3;
    margin:0 0 16px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    appearance:none;
    text-align:left;
    width:100%;
    border:1.5px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    border-radius:14px;
    padding:13px 14px;
    font-family:inherit;
    font-size:14.5px;
    font-weight:500;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    line-height:1.3;
  }
  .opt .letter{
    flex:none;
    width:24px;height:24px;
    border-radius:50%;
    background:var(--border);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800;
  }
  .opt.correct{border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good);}
  .opt.correct .letter{background:var(--good); color:#0b0d0a;}
  .opt.wrong{border-color:var(--danger); box-shadow:inset 0 0 0 1px var(--danger);}
  .opt.wrong .letter{background:var(--danger); color:#0b0d0a;}
  .opt:disabled{cursor:default;}

  .explain{
    margin-top:12px;
    font-size:13px;
    color:var(--text-dim);
    border-left:3px solid var(--accent);
    padding-left:10px;
    line-height:1.4;
  }

  /* ---- RECAP SCREEN ---- */
  .recap-title{
    font-family:"Bebas Neue", sans-serif;
    font-size:32px;
    text-align:center;
    margin:4px 0 2px;
  }
  .recap-sub{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    margin-bottom:16px;
  }
  .recap-score{
    display:flex;
    justify-content:center;
    align-items:baseline;
    gap:6px;
    margin:10px 0 18px;
  }
  .recap-score b{
    font-family:"Bebas Neue", sans-serif;
    font-size:54px;
    color:var(--accent);
    line-height:1;
  }
  .recap-score span{color:var(--text-dim); font-size:16px;}
  .again-btn{
    appearance:none; border:none;
    background:var(--accent); color:var(--accent-ink);
    font-family:"Bebas Neue", sans-serif;
    font-size:20px; letter-spacing:0.03em;
    border-radius:14px; padding:14px; width:100%; cursor:pointer;
  }
  .home-btn{
    appearance:none; border:1.5px solid var(--border);
    background:transparent; color:var(--text);
    border-radius:14px; padding:12px; width:100%; cursor:pointer;
    font-family:inherit; font-weight:600; font-size:14px; margin-top:8px;
  }

  [hidden]{display:none!important;}

  footer{
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
    margin-top:4px;
  }
</style>

<div class="app">
  <div class="brand">
    <h1>Repos <span>&amp; révise</span></h1>
    <small id="dateLabel">BTS NDRC</small>
  </div>

  <!-- SETUP -->
  <div id="screenSetup">
    <div class="card">
      <div class="label">Matières à réviser</div>
      <div class="subjects" id="subjectGrid"></div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="label">Durée du repos</div>
      <div class="durations" id="durationGrid"></div>
    </div>

    <button class="start-btn" id="startBtn" style="margin-top:14px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
      Lancer la série
    </button>

    <div class="stats-row" style="margin-top:14px;">
      <div class="stat"><b id="statToday">0</b><span>Aujourd'hui</span></div>
      <div class="stat"><b id="statTotal">0</b><span>Questions vues</span></div>
      <div class="stat"><b id="statAcc">—</b><span>Réussite</span></div>
    </div>
  </div>

  <!-- RUNNING -->
  <div id="screenRun" hidden>
    <div class="card">
      <div class="run-head">
        <div class="timer-wrap">
          <svg viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="42"></circle>
            <circle class="ring-fg" id="ring" cx="50" cy="50" r="42"></circle>
          </svg>
          <div class="timer-num" id="timeLeft">3:00</div>
        </div>
        <div class="run-meta">
          <div class="label">En cours</div>
          <div class="progress" id="scoreRun">0 / 0</div>
        </div>
        <button class="stop-btn" id="stopBtn">Stop</button>
      </div>

      <div class="qcard">
        <span class="tag" id="qTag">CEJM</span>
        <h2 id="qText">Question</h2>
        <div class="options" id="qOptions"></div>
        <div class="explain" id="qExplain" hidden></div>
      </div>
    </div>
  </div>

  <!-- RECAP -->
  <div id="screenRecap" hidden>
    <div class="card">
      <div class="recap-title">Retour à la barre 💪</div>
      <div class="recap-sub" id="recapSub">Série terminée</div>
      <div class="recap-score"><b id="recapCorrect">0</b><span id="recapOf">/ 0 bonnes réponses</span></div>
      <button class="again-btn" id="againBtn">Encore 3 minutes</button>
      <button class="home-btn" id="homeBtn">Changer de matière</button>
    </div>
  </div>

  <footer>Fait pour tes temps de récup — pose ton tel, une question suffit.</footer>
</div>

<script>
(function(){
  "use strict";

  // ---------- Question bank ----------
  var BANK = {
    cejm1: { label:"CEJM · Agents éco", short:"CEJM Agents", items:[
      {q:"Combien y a-t-il d'agents économiques principaux ?", o:["3","4","5","6"], a:1, e:"Ménages, entreprises, banques, administrations publiques."},
      {q:"Quelle est la fonction principale des ménages ?", o:["Consommer","Produire","Financer","Réglementer"], a:0, e:"Les ménages consomment des biens et services."},
      {q:"Quelle est la fonction principale des entreprises ?", o:["Redistribuer","Produire des biens et services marchands","Épargner uniquement","Réguler le marché"], a:1},
      {q:"Quelle est la fonction principale des banques ?", o:["Produire des services non marchands","Consommer","Financer l'économie (crédits)","Payer des impôts"], a:2},
      {q:"Quel est le rôle des administrations publiques ?", o:["Produire des services non marchands et redistribuer","Vendre des produits avec profit","Faire des prêts aux entreprises","Employer tous les ménages"], a:0},
      {q:"Un flux réel correspond à...", o:["Un virement bancaire","Un échange de biens, services ou travail","Le paiement d'un salaire","Un crédit accordé"], a:1},
      {q:"Un flux monétaire correspond à...", o:["Un échange d'argent (paiement, salaire, crédit)","La livraison d'un produit","Une prestation de service","Le travail fourni par un salarié"], a:0},
      {q:"France Travail appartient à quelle catégorie d'agent ?", o:["Entreprise","Ménage","Administration publique","Banque"], a:2},
      {q:"Le type de production d'une administration publique est...", o:["Marchande","Non marchande","Mixte","Industrielle"], a:1},
      {q:"Qui verse les cotisations sociales à l'URSSAF ?", o:["Les banques","Les ménages seuls","Les entreprises (employeurs)","L'État uniquement"], a:2}
    ]},
    cejm2: { label:"CEJM · Marchés", short:"CEJM Marchés", items:[
      {q:"Combien de types de marché existe-t-il traditionnellement ?", o:["2","3","4","5"], a:1, e:"Marché des biens/services, marché du travail, marché financier."},
      {q:"Sur le marché du travail, qui est demandeur ?", o:["Les ménages","Les entreprises","L'État seul","Les banques"], a:1},
      {q:"Sur le marché du travail, qui est offreur ?", o:["Les entreprises","Les banques","Les ménages (chercheurs d'emploi)","L'État"], a:2},
      {q:"Sur le marché financier, qui a une capacité de financement ?", o:["Les ménages (épargnants)","Les entreprises","L'État","Les administrations"], a:0},
      {q:"Sur le marché financier, qui a un besoin de financement ?", o:["Les ménages","Entreprises et État","Les banques centrales","Personne"], a:1},
      {q:"Le prix sur un marché résulte de...", o:["La décision de l'État","La rencontre entre l'offre et la demande","Le coût de production seul","La loi sur la concurrence"], a:1},
      {q:"Une barrière à l'entrée peut être...", o:["Uniquement géographique","Financière, réglementaire ou technologique","Toujours illégale","Fixée par les syndicats"], a:1},
      {q:"Une externalité négative est...", o:["Un bénéfice partagé","Un effet néfaste subi par un tiers sans compensation","Une aide de l'État","Une hausse de prix"], a:1, e:"Exemple : la pollution générée par une usine."},
      {q:"L'asymétrie d'information désigne...", o:["Un prix trop élevé","Un agent qui en sait plus qu'un autre sur le marché","Une absence de concurrence","Un marché saturé"], a:1},
      {q:"Une entente sur les prix entre concurrents est...", o:["Encouragée","Interdite","Obligatoire","Sans conséquence"], a:1}
    ]},
    rcmkt: { label:"RC · Marché & Marketing", short:"RC Marketing", items:[
      {q:"Que signifie le modèle PESTEL ?", o:["Prix, Étude, Stock, Tarif, Emplacement, Livraison","Politique, Économique, Socioculturel, Technologique, Écologique, Légal","Produit, Enseigne, Stratégie, Test, Écoute, Logistique","Plan, Étape, Suivi, Test, Évaluation, Lancement"], a:1},
      {q:"Le marketing stratégique se situe sur...", o:["Le court terme","Le long terme","Une seule journée","Le très court terme uniquement"], a:1},
      {q:"Le marketing opérationnel se situe sur...", o:["Le long terme","Le court terme","10 ans","Aucun horizon défini"], a:1},
      {q:"Une analyse SWOT étudie...", o:["Forces, Faiblesses, Opportunités, Menaces","Ventes, Web, Objectifs, Taxes","Stock, Web, Organisation, Trésorerie","Segmentation, Web, Offre, Tarif"], a:0},
      {q:"Combien de P compte le mix marketing étendu ?", o:["3","4","5","7"], a:2, e:"Product, Price, Place, Promotion, People."},
      {q:"Une stratégie de prix d'écrémage consiste à...", o:["Vendre au prix le plus bas du marché","Fixer un prix élevé pour une clientèle premium","Aligner son prix sur celui du leader","Brader ses produits"], a:1},
      {q:"La largeur d'une gamme correspond à...", o:["Le nombre de références dans une ligne","Le nombre de lignes de produits","Le prix moyen des produits","La durée de vie du produit"], a:1},
      {q:"La profondeur d'une gamme correspond à...", o:["Le nombre de lignes de produits","Le nombre de références dans une ligne","Le nombre de concurrents","La taille de l'entreprise"], a:1},
      {q:"Une marque doit juridiquement être...", o:["Chère et complexe","Disponible, licite, non déceptive, non générique","Identique à celle d'un concurrent","Courte uniquement"], a:1},
      {q:"Le earned media désigne...", o:["Les publicités payantes","Le site web de l'entreprise","La communication gratuite générée par les clients (avis, réseaux sociaux)","Les panneaux publicitaires"], a:2},
      {q:"Le owned media désigne...", o:["Les supports possédés par l'entreprise (site, appli)","Les publications de journalistes","Les avis clients spontanés","La publicité télévisée"], a:0}
    ]},
    rcstat: { label:"RC · Statistiques", short:"RC Stats", items:[
      {q:"La médiane est...", o:["La moyenne arithmétique","La valeur qui partage la série en deux parties égales","La valeur la plus fréquente","L'écart entre le min et le max"], a:1},
      {q:"L'écart-type mesure...", o:["La valeur centrale d'une série","La dispersion des valeurs autour de la moyenne","Le nombre total d'observations","Le taux de croissance"], a:1},
      {q:"Quelle est la formule du taux de croissance ?", o:["(Arrivée - Départ) / Départ x 100","Arrivée / Départ","Départ - Arrivée","(Arrivée + Départ) / 2"], a:0},
      {q:"La méthode de Mayer sert à...", o:["Calculer un écart-type","Établir une droite d'ajustement pour prévoir les ventes","Calculer une part de marché","Segmenter la clientèle"], a:1},
      {q:"Dans la méthode de Mayer, on divise la série en...", o:["Trois groupes","Deux groupes égaux (ou presque)","Cinq groupes","Un seul groupe"], a:1},
      {q:"Le mode d'une série statistique est...", o:["La valeur la plus fréquente","La valeur centrale","La moyenne pondérée","L'écart-type"], a:0}
    ]},
    rcdigi: { label:"RC · Digital & CRM", short:"RC Digital", items:[
      {q:"Le multicanal désigne...", o:["Un seul canal de vente","Plusieurs canaux qui fonctionnent de façon indépendante","Des canaux totalement intégrés","Une vente uniquement en magasin"], a:1},
      {q:"Le cross-canal désigne...", o:["Des canaux complémentaires ponctuellement (ex : click and collect)","Un seul canal digital","Une intégration totale du parcours client","L'absence de canal physique"], a:0},
      {q:"L'omnicanal désigne...", o:["Un canal unique performant","Une intégration totale de tous les canaux avec une vision unique du client","La vente exclusivement en ligne","Un canal réservé aux professionnels"], a:1},
      {q:"À quoi sert un CRM (Customer Relationship Management) ?", o:["Gérer la comptabilité","Gérer et centraliser la relation avec les clients","Gérer les stocks uniquement","Créer des fiches produits"], a:1},
      {q:"Que signifie GRC ?", o:["Gestion des Ressources Commerciales","Gestion de la Relation Client","Groupe de Recherche Client","Gestion des Résultats Commerciaux"], a:1},
      {q:"Un logiciel de phoning sert notamment à...", o:["Créer des factures","Automatiser les appels et gérer les campagnes de prospection téléphonique","Gérer les stocks","Concevoir des visuels publicitaires"], a:1},
      {q:"Un centre de relation client (CRC) peut être...", o:["Uniquement interne","Uniquement externe","Interne ou externe (sous-traité)","Toujours gratuit"], a:2},
      {q:"Le traitement d'une base de données clients permet de...", o:["Segmenter, cibler et personnaliser la relation client","Supprimer les données inutiles uniquement","Remplacer le CRM","Fixer les prix de vente"], a:0}
    ]},
    rcdist: { label:"RC · Distribution", short:"RC Distribution", items:[
      {q:"Un circuit direct signifie...", o:["Le producteur vend directement au client final, sans intermédiaire","Il y a un seul intermédiaire","Il y a plusieurs intermédiaires","La vente passe par un grossiste"], a:0},
      {q:"Un circuit court comporte...", o:["Aucun intermédiaire","Un seul intermédiaire","Plusieurs intermédiaires","Uniquement des grossistes"], a:1},
      {q:"Un circuit long comporte...", o:["Aucun intermédiaire","Un seul intermédiaire","Plusieurs intermédiaires","Uniquement le producteur"], a:2},
      {q:"Une franchise repose sur...", o:["Le rachat total de l'enseigne","Une marque et un savoir-faire cédés contre des redevances","Un contrat sans obligation","La gratuité totale"], a:1},
      {q:"Une concession accorde à un distributeur...", o:["L'exclusivité de distribution sur un territoire donné","La propriété de la marque","Un statut de salarié","Aucun droit particulier"], a:0},
      {q:"Une centrale d'achat sert à...", o:["Vendre directement aux clients finaux","Regrouper les achats de plusieurs points de vente pour négocier de meilleurs prix","Remplacer les fournisseurs","Gérer uniquement la publicité"], a:1},
      {q:"Un réseau intégré (comme Carrefour) est composé de...", o:["Commerçants indépendants sous contrat","Points de vente appartenant à un même groupe","Franchisés uniquement","Fournisseurs externes"], a:1}
    ]}
  };

  var order = Object.keys(BANK);

  // ---------- Storage helpers ----------
  function loadStore(){
    try{
      var raw = localStorage.getItem("gymrevise_v1");
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {total:0, correct:0, days:{}};
  }
  function saveStore(s){
    try{ localStorage.setItem("gymrevise_v1", JSON.stringify(s)); }catch(e){}
  }
  var store = loadStore();

  function todayKey(){
    var d = new Date();
    return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  }

  function renderStats(){
    var tk = todayKey();
    document.getElementById("statToday").textContent = (store.days[tk] || 0);
    document.getElementById("statTotal").textContent = store.total;
    document.getElementById("statAcc").textContent = store.total ? Math.round(100*store.correct/store.total)+"%" : "—";
  }

  // ---------- Setup screen state ----------
  var selectedSubjects = {};
  order.forEach(function(k){ selectedSubjects[k] = true; });
  var duration = 180; // seconds

  var subjectGrid = document.getElementById("subjectGrid");
  order.forEach(function(key){
    var btn = document.createElement("button");
    btn.className = "chip";
    btn.type = "button";
    btn.setAttribute("aria-pressed", "true");
    btn.innerHTML = '<span class="dot"></span>' + BANK[key].label;
    btn.addEventListener("click", function(){
      selectedSubjects[key] = !selectedSubjects[key];
      btn.setAttribute("aria-pressed", selectedSubjects[key] ? "true" : "false");
      updateStartState();
    });
    subjectGrid.appendChild(btn);
  });

  var durationGrid = document.getElementById("durationGrid");
  [["2 min",120], ["3 min",180], ["5 min",300]].forEach(function(pair){
    var btn = document.createElement("button");
    btn.className = "dur-btn";
    btn.type = "button";
    btn.textContent = pair[0];
    btn.setAttribute("aria-pressed", pair[1] === 180 ? "true" : "false");
    btn.addEventListener("click", function(){
      duration = pair[1];
      Array.prototype.forEach.call(durationGrid.children, function(c){ c.setAttribute("aria-pressed","false"); });
      btn.setAttribute("aria-pressed","true");
    });
    durationGrid.appendChild(btn);
  });

  var startBtn = document.getElementById("startBtn");
  function updateStartState(){
    var any = order.some(function(k){ return selectedSubjects[k]; });
    startBtn.disabled = !any;
  }
  updateStartState();

  // ---------- Question pool ----------
  function buildPool(){
    var pool = [];
    order.forEach(function(key){
      if(!selectedSubjects[key]) return;
      BANK[key].items.forEach(function(item){
        pool.push({subject:BANK[key].short, q:item.q, o:item.o, a:item.a, e:item.e || ""});
      });
    });
    // shuffle
    for(var i = pool.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i+1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    return pool;
  }

  // ---------- Screens ----------
  var screenSetup = document.getElementById("screenSetup");
  var screenRun = document.getElementById("screenRun");
  var screenRecap = document.getElementById("screenRecap");

  function showScreen(name){
    screenSetup.hidden = name !== "setup";
    screenRun.hidden = name !== "run";
    screenRecap.hidden = name !== "recap";
  }

  // ---------- Run state ----------
  var RADIUS = 42, CIRC = 2 * Math.PI * RADIUS;
  var ring = document.getElementById("ring");
  ring.style.strokeDasharray = CIRC.toFixed(1);

  var timeLeftEl = document.getElementById("timeLeft");
  var scoreRunEl = document.getElementById("scoreRun");
  var qTagEl = document.getElementById("qTag");
  var qTextEl = document.getElementById("qText");
  var qOptionsEl = document.getElementById("qOptions");
  var qExplainEl = document.getElementById("qExplain");

  var runTimer = null, endsAt = 0, totalDuration = 180;
  var pool = [], poolIdx = 0, answered = 0, correctCount = 0, advanceTimeout = null;

  function fmtTime(s){
    var m = Math.floor(s/60), sec = s%60;
    return m + ":" + (sec < 10 ? "0"+sec : sec);
  }

  function tick(){
    var remaining = Math.max(0, Math.round((endsAt - Date.now())/1000));
    timeLeftEl.textContent = fmtTime(remaining);
    var frac = remaining / totalDuration;
    ring.style.strokeDashoffset = (CIRC * (1 - frac)).toFixed(1);
    if(remaining <= 0){
      finishSession();
    }
  }

  function nextQuestion(){
    if(advanceTimeout){ clearTimeout(advanceTimeout); advanceTimeout = null; }
    if(poolIdx >= pool.length){ pool = buildPool(); poolIdx = 0; }
    var item = pool[poolIdx++];
    qTagEl.textContent = item.subject;
    qTextEl.textContent = item.q;
    qExplainEl.hidden = true;
    qExplainEl.textContent = item.e;
    qOptionsEl.innerHTML = "";
    var letters = ["A","B","C","D"];
    item.o.forEach(function(optText, idx){
      var b = document.createElement("button");
      b.className = "opt";
      b.type = "button";
      b.innerHTML = '<span class="letter">'+letters[idx]+'</span><span>'+optText+'</span>';
      b.addEventListener("click", function(){ chooseAnswer(item, idx, b); });
      qOptionsEl.appendChild(b);
    });
  }

  function chooseAnswer(item, idx, btnEl){
    if(qOptionsEl.getAttribute("data-locked") === "1") return;
    qOptionsEl.setAttribute("data-locked","1");
    var opts = qOptionsEl.querySelectorAll(".opt");
    opts.forEach(function(o){ o.disabled = true; });
    opts[item.a].classList.add("correct");
    if(idx !== item.a){ btnEl.classList.add("wrong"); }
    answered++;
    var isCorrect = idx === item.a;
    if(isCorrect) correctCount++;
    scoreRunEl.textContent = correctCount + " / " + answered;
    store.total++;
    if(isCorrect) store.correct++;
    var tk = todayKey();
    store.days[tk] = (store.days[tk] || 0) + 1;
    saveStore(store);
    if(item.e){ qExplainEl.hidden = false; }
    advanceTimeout = setTimeout(function(){
      qOptionsEl.removeAttribute("data-locked");
      if(Date.now() < endsAt){ nextQuestion(); }
    }, item.e ? 1900 : 1100);
  }

  function startSession(){
    pool = buildPool();
    if(!pool.length) return;
    poolIdx = 0; answered = 0; correctCount = 0;
    totalDuration = duration;
    endsAt = Date.now() + duration * 1000;
    scoreRunEl.textContent = "0 / 0";
    showScreen("run");
    nextQuestion();
    tick();
    runTimer = setInterval(tick, 1000);
  }

  function finishSession(){
    if(runTimer){ clearInterval(runTimer); runTimer = null; }
    if(advanceTimeout){ clearTimeout(advanceTimeout); advanceTimeout = null; }
    document.getElementById("recapCorrect").textContent = correctCount;
    document.getElementById("recapOf").textContent = "/ " + answered + " bonnes réponses";
    var pct = answered ? Math.round(100*correctCount/answered) : 0;
    var msg = pct >= 80 ? "Solide, tu maîtrises." : pct >= 50 ? "Pas mal, encore un effort." : "Continue, ça va rentrer.";
    document.getElementById("recapSub").textContent = msg + " Retourne à la barre.";
    renderStats();
    showScreen("recap");
  }

  document.getElementById("startBtn").addEventListener("click", startSession);
  document.getElementById("stopBtn").addEventListener("click", finishSession);
  document.getElementById("againBtn").addEventListener("click", startSession);
  document.getElementById("homeBtn").addEventListener("click", function(){
    renderStats();
    showScreen("setup");
  });

  renderStats();
  showScreen("setup");
})();
</script>
